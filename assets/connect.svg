<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="Connect: GitHub, LinkedIn and npm. Portfolio at yagyesh-portfolio.vercel.app.">
  <title>Connect: GitHub, LinkedIn and npm. Portfolio at yagyesh-portfolio.vercel.app.</title>
  <style>
  .mconnect{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .sconnect{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
  .rconnect{font-family:Georgia, 'Times New Roman', serif}
  @media (prefers-reduced-motion: reduce) {
  .mo { display: none !important; }
  * { animation: none !important; }
}
</style>
  <defs>
    <clipPath id="connect-frame"><rect width="1000" height="76" rx="18"/></clipPath>
    <linearGradient id="connect-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F19"/><stop offset="100%" stop-color="#06090F"/>
    </linearGradient>
    <pattern id="connect-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#243349" opacity="0.55"/>
    </pattern>
    <linearGradient id="connect-ruleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4EF0C0" stop-opacity="0"/><stop offset="50%" stop-color="#4EF0C0" stop-opacity="0.9"/><stop offset="100%" stop-color="#4EF0C0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="connect-rule"><rect x="30" y="60" width="940" height="4"/></clipPath>
    <radialGradient id="connect-tint" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#4EF0C0" stop-opacity="0.07"/><stop offset="70%" stop-color="#4EF0C0" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  <g clip-path="url(#connect-frame)">
    <rect width="1000" height="76" fill="url(#connect-shell)"/>
    <rect width="1000" height="76" fill="url(#connect-dots)"/>
    <rect width="1000" height="76" fill="url(#connect-tint)"/>
    
    <text x="30" y="45" class="mconnect" font-size="10" letter-spacing="1.6" fill="#4EF0C0">07</text>
    <text x="58.4" y="45" class="mconnect" font-size="10.5" letter-spacing="3.4" fill="#9BA9BE">CONNECT</text>
    <text x="970" y="45" class="mconnect" font-size="9.5" letter-spacing="1.2" fill="#6C7C93" text-anchor="end">OSS · AI SECURITY · LOCAL AI</text>
    <line x1="30" y1="62" x2="970" y2="62" stroke="#17202F" stroke-width="1"/>
    <g clip-path="url(#connect-rule)">
      <rect class="mo" x="-90" y="61.2" width="90" height="1.6" fill="url(#connect-ruleG)">
        <animate attributeName="x" values="-90;1000" dur="7s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="1" y="1" width="998" height="1" fill="#FFFFFF" opacity="0.035"/>
    <text x="500" y="45" class="mconnect" font-size="9" letter-spacing="1.2" fill="#6C7C93" text-anchor="middle">yagyesh-portfolio.vercel.app</text>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="74.5" rx="17.25" fill="none" stroke="#17202F" stroke-width="1.5"/>
  <g stroke="#243349" stroke-width="1" opacity="0.75">
    <path d="M16 23V16h7" fill="none"/>
    <path d="M977 16h7v7" fill="none"/>
    <path d="M16 53v7h7" fill="none"/>
    <path d="M977 60h7v7" fill="none"/>
  </g>
</svg>